<section id="treatsView" class="h-full flex flex-col w-full relative z-10 p-4 md:p-6 overflow-y-auto no-scrollbar">
    <div class="mb-6 bg-white/40 backdrop-blur-xl p-6 rounded-3xl border border-pink-100 shadow-lg">
        <h2 class="text-3xl font-black text-gray-800 tracking-tight">Staff & Internal Log</h2>
        <p class="text-gray-500 text-sm mt-1 font-medium">Record items consumed by staff, damaged, or used for testing. These units are deducted from stock but do not generate revenue.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Logger Form -->
        <div class="bg-white/60 backdrop-blur-2xl p-8 rounded-[2rem] border border-pink-100 shadow-xl h-fit relative overflow-hidden">
            <div class="absolute -right-4 -top-4 w-32 h-32 bg-pink-200/50 rounded-full blur-3xl"></div>
            
            <h3 class="text-xl font-extrabold text-gray-800 mb-6 relative z-10">Log an Item</h3>
            <form id="treatsForm" class="space-y-5 relative z-10">
                
                <!-- NEW: Dynamic Staff Name Input -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Staff Member Name</label>
                    <input type="text" id="treatStaffName" list="staffNameList" required placeholder="Select or type a name..." autocomplete="off"
                           class="w-full bg-white/80 border border-pink-100 rounded-2xl px-5 py-3 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm cursor-pointer">
                    <datalist id="staffNameList">
                        <!-- Populated dynamically via JS -->
                    </datalist>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Select Product</label>
                    <select id="treatProductSelect" required class="w-full bg-white/80 border border-pink-100 rounded-2xl px-5 py-3 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm">
                        <!-- Populated via JS -->
                    </select>
                </div>
                
                <div class="flex gap-4">
                    <div class="w-1/3">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Units</label>
                        <input type="number" id="treatUnits" value="1" min="1" required class="w-full bg-white/80 border border-pink-100 rounded-2xl px-5 py-3 text-pink-500 text-xl font-black focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm text-center">
                    </div>
                    <div class="w-2/3">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Reason</label>
                        <select id="treatReason" required class="w-full bg-white/80 border border-pink-100 rounded-2xl px-5 py-3.5 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm">
                            <option value="Staff/Owner Treat">Staff/Owner Treat 🍦</option>
                            <option value="Damaged/Melted">Damaged / Melted ⚠️</option>
                            <option value="Quality Testing">Quality Testing 🔬</option>
                            <option value="Promotional Giveaway">Promo Giveaway 🎁</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="treatSubmitBtn" class="w-full bg-gradient-to-r from-pink-400 to-purple-500 text-white font-black py-4 rounded-2xl hover:shadow-lg hover:shadow-pink-200 transition-all mt-6 transform hover:scale-[1.02]">
                    DEDUCT FROM STOCK
                </button>
            </form>
        </div>

        <!-- Recent Logs Table -->
        <div class="lg:col-span-2 bg-white/60 backdrop-blur-2xl p-6 rounded-[2rem] border border-pink-100 shadow-xl flex flex-col">
            <h3 class="text-xl font-extrabold text-gray-800 mb-6">Recent Activity Log</h3>
            <div class="flex-1 overflow-auto no-scrollbar rounded-xl border border-white/50 bg-white/30">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="sticky top-0 bg-white/80 backdrop-blur-md shadow-sm z-10">
                        <tr class="text-[10px] uppercase tracking-widest text-gray-500 border-b border-pink-100">
                            <th class="p-5 font-bold">Date & Time</th>
                            <th class="p-5 font-bold">Staff Name</th>
                            <th class="p-5 font-bold">Product</th>
                            <th class="p-5 font-bold text-center">Qty</th>
                            <th class="p-5 font-bold">Reason</th>
                        </tr>
                    </thead>
                    <tbody id="treatsHistoryBody" class="divide-y divide-pink-50">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
