<section id="treatsView" class="h-full flex flex-col w-full relative z-10 p-4 md:p-6 overflow-y-auto custom-scrollbar">
    <div class="mb-4 md:mb-6 bg-white/40 backdrop-blur-xl p-4 md:p-6 rounded-3xl border border-pink-100 shadow-lg">
        <h2 class="text-2xl md:text-3xl font-black text-gray-800 tracking-tight">Staff & Internal Log</h2>
        <p class="text-gray-500 text-xs md:text-sm mt-1 font-medium">Record items consumed by staff, damaged, or used for testing. These units are deducted from stock but do not generate revenue.</p>
    </div>

    <!-- Top Row: Logger Form & Outstanding Dues Summary -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 mb-4 md:mb-6">
        
        <!-- Logger Form -->
        <div class="bg-white/60 backdrop-blur-2xl p-6 md:p-8 rounded-[2rem] border border-pink-100 shadow-xl h-fit relative overflow-hidden flex flex-col">
            <div class="absolute -right-4 -top-4 w-32 h-32 bg-pink-200/50 rounded-full blur-3xl"></div>
            
            <h3 class="text-lg md:text-xl font-extrabold text-gray-800 mb-4 md:mb-6 relative z-10">Log Items</h3>
            <form id="treatsForm" class="space-y-4 md:space-y-5 relative z-10 flex-1 flex flex-col">
                
                <div>
                    <label class="block text-[10px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5 md:mb-2">Staff Member Name</label>
                    <input type="text" id="treatStaffName" list="staffNameList" required placeholder="Select or type a name..." autocomplete="off"
                           class="w-full bg-white/80 border border-pink-100 rounded-xl md:rounded-2xl px-4 md:px-5 py-2.5 md:py-3 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm cursor-pointer text-sm md:text-base">
                    <datalist id="staffNameList"></datalist>
                </div>

                <!-- Searchable Product Selection -->
                <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-[10px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5 md:mb-2">Search Product</label>
                        <input type="text" id="treatProductSearch" list="treatProductDataList" placeholder="Type to search..." autocomplete="off" class="w-full bg-white/80 border border-pink-100 rounded-xl md:rounded-2xl px-4 md:px-5 py-2.5 md:py-3 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm text-sm md:text-base">
                        <datalist id="treatProductDataList"></datalist>
                    </div>
                    <button type="button" onclick="addTreatItem()" class="w-full sm:w-auto bg-gray-800 text-white px-5 py-2.5 md:py-3 rounded-xl md:rounded-2xl font-bold hover:bg-black transition-colors shadow-md text-sm md:text-base">ADD</button>
                </div>

                <!-- Mini Cart Container -->
                <div id="treatCartContainer" class="bg-white/50 rounded-xl md:rounded-2xl p-3 md:p-4 border border-pink-100 hidden">
                    <h4 class="text-[9px] md:text-[10px] font-bold text-pink-500 uppercase tracking-widest mb-2 md:mb-3">Selected Items</h4>
                    <ul id="treatCartList" class="space-y-2 max-h-32 md:max-h-40 overflow-y-auto custom-scrollbar pr-2">
                        <!-- Added items appear here -->
                    </ul>
                </div>
                
                <div>
                    <label class="block text-[10px] md:text-xs font-bold text-gray-500 uppercase tracking-widest mb-1.5 md:mb-2">Reason</label>
                    <select id="treatReason" required class="w-full bg-white/80 border border-pink-100 rounded-xl md:rounded-2xl px-4 md:px-5 py-2.5 md:py-3.5 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-pink-300 transition-all shadow-sm cursor-pointer text-sm md:text-base">
                        <option value="Staff/Owner Treat">Staff/Owner Treat 🍦</option>
                        <option value="Damaged/Melted">Damaged / Melted ⚠️</option>
                        <option value="Quality Testing">Quality Testing 🔬</option>
                        <option value="Promotional Giveaway">Promo Giveaway 🎁</option>
                    </select>
                </div>
                
                <button type="submit" id="treatSubmitBtn" class="w-full bg-gradient-to-r from-pink-400 to-purple-500 text-white font-black py-3 md:py-4 rounded-xl md:rounded-2xl hover:shadow-lg hover:shadow-pink-200 transition-all mt-4 md:mt-auto transform hover:scale-[1.02] text-sm md:text-base">
                    DEDUCT FROM STOCK
                </button>
            </form>
        </div>

        <!-- Staff Pending Dues Tracker -->
        <div class="lg:col-span-2 bg-white/60 backdrop-blur-2xl p-6 rounded-[2rem] border border-pink-100 shadow-xl flex flex-col h-full max-h-[400px] md:max-h-[500px]">
            <div class="flex justify-between items-center mb-4 md:mb-6 border-b border-pink-100 pb-3 md:pb-4">
                <h3 class="text-lg md:text-xl font-extrabold text-gray-800">Pending Dues</h3>
                <div class="text-right">
                    <p class="text-[9px] md:text-[10px] font-bold text-gray-500 uppercase tracking-widest">Total Outstanding</p>
                    <p class="text-2xl md:text-3xl font-black text-pink-500" id="overallTreatsTotal">₹0.00</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 overflow-y-auto custom-scrollbar pb-2" id="staffDuesContainer">
                <!-- Cards injected via JS -->
            </div>
        </div>
    </div>

    <!-- Bottom Row: Recent Logs Table -->
    <div class="bg-white/60 backdrop-blur-2xl p-4 md:p-6 rounded-[2rem] border border-pink-100 shadow-xl flex flex-col mb-6">
        <h3 class="text-lg md:text-xl font-extrabold text-gray-800 mb-4 md:mb-6">Recent Activity Log</h3>
        <div class="flex-1 overflow-hidden rounded-xl border border-white/50 bg-white/30">
            <!-- ADDED overflow-x-auto for mobile scrolling -->
            <div class="overflow-y-auto overflow-x-auto custom-scrollbar h-full max-h-[40vh] pb-4">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="sticky top-0 bg-white/90 backdrop-blur-md shadow-sm z-10">
                        <tr class="text-[9px] md:text-[10px] uppercase tracking-widest text-gray-500 border-b border-pink-100">
                            <th class="p-3 md:p-5 font-bold">Date & Time</th>
                            <th class="p-3 md:p-5 font-bold">Staff Name</th>
                            <th class="p-3 md:p-5 font-bold">Product</th>
                            <th class="p-3 md:p-5 font-bold text-center">Qty</th>
                            <th class="p-3 md:p-5 font-bold">Reason</th>
                            <th class="p-3 md:p-5 font-bold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="treatsHistoryBody" class="divide-y divide-pink-50">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
