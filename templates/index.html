<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICEPOPS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #1f2937; /* text-gray-800 */
            background-image: url('static/icecream_background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Soft, frosted white overlay */
        .bg-overlay {
            background-color: rgba(252, 249, 249, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Light glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .theme-pink { color: #f2b5b8; }
        .bg-theme-pink { background-color: #f2b5b8; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-full overflow-hidden flex flex-col md:flex-row relative">

    <div class="absolute inset-0 bg-overlay -z-10"></div>

    <!-- Top Utility Bar (Mobile Only) -->
    <div class="md:hidden glass w-full p-4 flex justify-between items-center z-30 border-b border-pink-100">
        <h1 class="text-xl font-black tracking-tighter theme-pink">ICEPOPS.</h1>
        <div id="mobileClock" class="text-sm font-bold text-gray-500">00:00</div>
    </div>

    <!-- Responsive Navigation -->
    <nav class="fixed bottom-0 left-0 w-full md:relative md:w-24 lg:w-64 glass border-t md:border-t-0 md:border-r border-pink-100 p-2 md:p-4 flex flex-row md:flex-col justify-around md:justify-between z-40 shadow-xl pb-safe">
        
        <div class="flex flex-row md:flex-col w-full gap-1 md:gap-3 justify-around md:justify-start">
            <h1 class="text-2xl font-black tracking-tighter theme-pink mb-8 hidden lg:block text-center lg:text-left mt-4">ICEPOPS.</h1>
            <h1 class="text-2xl font-black tracking-tighter theme-pink mb-8 hidden md:block lg:hidden text-center mt-4">IP.</h1>
            
            <button onclick="switchView('posWrapper', this)" class="nav-btn flex-1 md:flex-none p-2 md:p-3 rounded-2xl font-bold cursor-pointer bg-theme-pink text-white shadow-lg shadow-pink-200 transition-all flex flex-col md:flex-row items-center justify-center lg:justify-start">
                <span class="text-xl md:text-2xl mb-1 md:mb-0">🛒</span> 
                <span class="text-[10px] md:text-base hidden md:inline ml-0 md:ml-3">POS</span>
                <span class="text-[10px] md:hidden block">POS</span>
            </button>
            
            <button onclick="switchView('inventoryWrapper', this)" class="nav-btn flex-1 md:flex-none p-2 md:p-3 rounded-2xl font-semibold cursor-pointer text-gray-500 bg-white/40 hover:bg-white/80 border border-white/50 transition-all flex flex-col md:flex-row items-center justify-center lg:justify-start">
                <span class="text-xl md:text-2xl mb-1 md:mb-0">📦</span> 
                <span class="text-[10px] md:text-base hidden md:inline ml-0 md:ml-3">Inventory</span>
                <span class="text-[10px] md:hidden block">Stock</span>
            </button>
            
            <button onclick="switchView('dashboardWrapper', this)" class="nav-btn flex-1 md:flex-none p-2 md:p-3 rounded-2xl font-semibold cursor-pointer text-gray-500 bg-white/40 hover:bg-white/80 border border-white/50 transition-all flex flex-col md:flex-row items-center justify-center lg:justify-start">
                <span class="text-xl md:text-2xl mb-1 md:mb-0">📊</span> 
                <span class="text-[10px] md:text-base hidden md:inline ml-0 md:ml-3">Analytics</span>
                <span class="text-[10px] md:hidden block">Stats</span>
            </button>

            <button onclick="switchView('treatsWrapper', this)" class="nav-btn flex-1 md:flex-none p-2 md:p-3 rounded-2xl font-semibold cursor-pointer text-gray-500 bg-white/40 hover:bg-white/80 border border-white/50 transition-all flex flex-col md:flex-row items-center justify-center lg:justify-start">
                <span class="text-xl md:text-2xl mb-1 md:mb-0">🍦</span> 
                <span class="text-[10px] md:text-base hidden md:inline ml-0 md:ml-3">Staff Treats</span>
                <span class="text-[10px] md:hidden block">Treats</span>
            </button>
        </div>
        
        <div class="mt-auto hidden md:flex flex-col pt-4 border-t border-pink-100 text-center lg:text-left gap-3">
            <div class="flex justify-between items-center hidden lg:flex">
                <div id="desktopClock" class="text-sm font-bold text-gray-500">00:00:00</div>
                <button onclick="toggleFullScreen()" class="text-gray-400 hover:text-gray-800 transition-colors" title="Toggle Fullscreen">⛶</button>
            </div>
            <div>
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Operator</p>
                <p class="font-bold theme-pink truncate">{{ username }}</p>
            </div>
            <button onclick="logout()" class="text-sm font-bold text-gray-500 hover:text-red-400 transition-colors bg-white/40 px-4 py-2 rounded-xl border border-white/50 w-full">Log Out</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden flex flex-col w-full h-full pb-[72px] md:pb-0">
        <div class="relative w-full h-full">
            
            <div id="posWrapper" class="app-view absolute inset-0 transition-all duration-300 opacity-100 z-10 pointer-events-auto">
                {% include 'components/pos.html' %}
            </div>

            <div id="inventoryWrapper" class="app-view absolute inset-0 transition-all duration-300 opacity-0 pointer-events-none z-0">
                {% include 'components/inventory.html' %}
            </div>

            <div id="dashboardWrapper" class="app-view absolute inset-0 transition-all duration-300 opacity-0 pointer-events-none z-0">
                {% include 'components/dashboard.html' %}
            </div>
            
            <div id="treatsWrapper" class="app-view absolute inset-0 transition-all duration-300 opacity-0 pointer-events-none z-0">
                {% include 'components/treats.html' %}
            </div>

        </div>
    </main>

    <!-- Core Scripts -->
    <script src="{{ url_for('static', filename='js/pos.js') }}"></script>
    <script src="{{ url_for('static', filename='js/inventory.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/treats.js') }}"></script>
    
    <!-- Utilities & Routing -->
    <script>
        function switchView(targetViewId, clickedBtn) {
            const allBtns = document.querySelectorAll('.nav-btn');
            allBtns.forEach(btn => {
                btn.className = "nav-btn flex-1 md:flex-none p-2 md:p-3 rounded-2xl font-semibold cursor-pointer text-gray-500 bg-white/40 hover:bg-white/80 border border-white/50 transition-all flex flex-col md:flex-row items-center justify-center lg:justify-start";
            });
            clickedBtn.className = "nav-btn flex-1 md:flex-none p-2 md:p-3 rounded-2xl font-bold cursor-pointer bg-theme-pink text-white shadow-lg shadow-pink-200 transition-all flex flex-col md:flex-row items-center justify-center lg:justify-start";

            const allWrappers = document.querySelectorAll('.app-view');
            allWrappers.forEach(wrapper => {
                wrapper.classList.replace('opacity-100', 'opacity-0');
                wrapper.classList.replace('z-10', 'z-0');
                wrapper.classList.add('pointer-events-none');
                wrapper.classList.remove('pointer-events-auto');
            });

            const targetWrapper = document.getElementById(targetViewId);
            if (targetWrapper) {
                targetWrapper.classList.remove('pointer-events-none');
                targetWrapper.classList.add('pointer-events-auto');
                targetWrapper.classList.replace('opacity-0', 'opacity-100');
                targetWrapper.classList.replace('z-0', 'z-10');
            }

            if (targetViewId === 'posWrapper' && typeof loadProducts === 'function') loadProducts();
            if (targetViewId === 'inventoryWrapper' && typeof loadInventoryData === 'function') loadInventoryData();
            if (targetViewId === 'dashboardWrapper' && typeof setDashFilter === 'function') setDashFilter('today');
            if (targetViewId === 'treatsWrapper' && typeof loadTreatsData === 'function') loadTreatsData();
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const mobileTimeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const deskClock = document.getElementById('desktopClock');
            const mobClock = document.getElementById('mobileClock');
            
            if (deskClock) deskClock.innerText = timeString;
            if (mobClock) mobClock.innerText = mobileTimeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        async function logout() {
            try {
                const response = await fetch('/api/auth/logout', { method: 'POST' });
                if (response.ok) window.location.href = '/';
            } catch (err) {
                console.error("Logout failed", err);
            }
        }
        // --- KEEP AWAKE HEARTBEAT ---
        // Pings the server every 10 minutes (600,000 milliseconds) 
        // to prevent Render's free tier from spinning down the POS.
        setInterval(() => {
            fetch('/api/ping').catch(err => console.log("Heartbeat skipped."));
        }, 600000);
    </script>
</body>
</html>
